# The paseo pod profile (MISE_ENV=prod, set by paseo.json's api service):
# non-secret upstream seeds for agent-run exploratory stacks
# (docs/exploratory-testing.md). Credentials never live in a committed file —
# fnox fetches them from Proton Pass for the run:agent task (fnox.toml).
# Seeds apply on a worktree's first run only: once its DB has settings, env
# changes are ignored (wipe data/ to reseed).
[env]
# The tank is mounted read-only at /data in the paseo pod (home-ops
# agents/paseo) — the same share qBittorrent saves to, so imports need no
# path mapping and land (copied, not hardlinked: cross-filesystem) in the
# worktree-local library.
SENTO_QBITTORRENT_URL = "http://qbittorrent.downloads.svc.cluster.local"
# Never the live instance's category: agent grabs land under
# /data/Downloads/qbittorrent/complete/sento-test (created in qBittorrent).
SENTO_QBITTORRENT_CATEGORY = "sento-test"
SENTO_PROWLARR_URL = "http://prowlarr.downloads.svc.cluster.local"
