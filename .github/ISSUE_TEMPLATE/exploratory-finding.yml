---
name: Exploratory finding
description: Correctness or usability finding from an exploratory testing session
title: ''
labels: ['usability']
body:
  - type: markdown
    attributes:
      value: |
        Filed from an exploratory testing run (see
        [docs/exploratory-testing.md](../../docs/exploratory-testing.md)).
        Link any related issue below so findings can be tracked together.
  - type: input
    id: mission
    attributes:
      label: Mission, scenario and commit
      description: 'e.g. M2 / page-503 / abc123; offline or real-upstream mode'
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Repro
      description: Exact steps on a fresh worktree stack, or the state it was found in.
      placeholder: |
        1. Add series "…"
        2. Open editions → ⋯ menu → …
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What I expected
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happened / why it confuses
    validations:
      required: true
  - type: dropdown
    id: severity
    attributes:
      label: Severity class
      options:
        - Data loss or incorrect ownership
        - Wrong match, client, coverage or policy
        - Duplicate work or failed recovery
        - Dead end — no offered action can resolve it
        - Wrong label — control doesn't do what it says
        - Hidden narrative — state is knowable but shown in fragments
        - Friction — more steps than the task deserves
        - Raw internals — paths/errors/SQL shown to a user
    validations:
      required: true
  - type: input
    id: related-issue
    attributes:
      label: Related issue (if any)
      description: Link an existing issue that this finding reproduces or expands.
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Redacted UI/API evidence, request journal, file checks, and reload/restart result. Never include credentials.
      placeholder: web/src/components/… · GET /api/v1/… → …
