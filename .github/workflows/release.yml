# Attach packaged binaries, web UI, source and checksums to a tagged release.
# Images publish separately through image.yml, using the same validation gate.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  actions: read
  contents: write

jobs:
  validate:
    name: Verify release tag and CI
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - run: bash scripts/check-release.sh
        env:
          GH_TOKEN: ${{ github.token }}
          SENTO_RELEASE_TAG: ${{ github.ref_name }}

  web:
    name: Build shared web UI
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@6612f0ef07ed2a736cd1e00a94a065522dd41195 # v5.2.5
        with:
          install_args: node
          cache: true
      - run: mise run web:install
      - run: mise run web:build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-web
          path: web/dist/
          if-no-files-found: error

  build:
    needs: web
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
    env:
      VERSION: ${{ github.ref_name }}
      COMMIT: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # mise.toml pins go and node; the runner's toolchains are never used.
      - uses: jdx/mise-action@6612f0ef07ed2a736cd1e00a94a065522dd41195 # v5.2.5
        with:
          install_args: go
          cache: true

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-web
          path: web-dist

      - name: Build the server
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          CGO_ENABLED=0 mise exec -- go build -trimpath \
            -ldflags "-s -w -X github.com/h-wb/sento/internal/version.Version=${VERSION#v} -X github.com/h-wb/sento/internal/version.Commit=${COMMIT}" \
            -o "sento-${VERSION#v}-${GOOS}-${GOARCH}/sento" ./cmd/sento

      - name: Package
        run: |
          cp LICENSE "sento-${VERSION#v}-${GOOS}-${GOARCH}/LICENSE"
          cp -r web-dist "sento-${VERSION#v}-${GOOS}-${GOARCH}/web-dist"
          tar -czf "sento-${VERSION#v}-${GOOS}-${GOARCH}.tar.gz" \
            "sento-${VERSION#v}-${GOOS}-${GOARCH}"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sento-${{ matrix.goos }}-${{ matrix.goarch }}
          path: sento-*.tar.gz
          if-no-files-found: error

  publish:
    name: Publish the release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: sento-*
          path: dist
          merge-multiple: true

      - name: Source archive
        env:
          VERSION: ${{ github.ref_name }}
        run: git archive --format=tar.gz --prefix="sento-${VERSION#v}/" HEAD > "dist/sento-${VERSION#v}-source.tar.gz"

      - name: Checksums
        working-directory: dist
        run: sha256sum sento-*.tar.gz > checksums.txt

      # Release Please already created the release and its curated notes.
      # The manual tag path creates notes only when no release exists yet.
      - name: Attach release artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ github.ref_name }}
        run: |
          if ! gh release view "$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$VERSION" --repo "$GITHUB_REPOSITORY" \
              --title "sento ${VERSION#v}" --generate-notes --verify-tag
          fi
          gh release upload "$VERSION" --repo "$GITHUB_REPOSITORY" --clobber dist/*
