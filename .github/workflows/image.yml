# Builds the container images on every pull request and publishes them to
# the GitHub Container Registry from main and release tags. One workflow
# for both so the images that ship are built exactly the way PRs validated
# them.
#
#   ghcr.io/<owner>/sento        the server (Dockerfile)
#   ghcr.io/<owner>/sento-host   the extension sidecar (host/Dockerfile)
name: Image

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  image:
    name: Build and publish ${{ matrix.name }}
    runs-on: ubuntu-latest
    # The sidecar compiles the vendored Suwayomi tree when its layers are
    # not cached.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: sento
            context: .
            image: ghcr.io/${{ github.repository }}
          - name: sento-host
            context: host
            image: ghcr.io/${{ github.repository }}-host
    steps:
      - uses: actions/checkout@v7

      # No setup-qemu-action: both Dockerfiles run their build stages
      # natively on the runner (cross-compiling Go; JVM bytecode is
      # arch-independent), so emulation is never needed.
      - uses: docker/setup-buildx-action@v4

      - name: Log in to ghcr.io
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive tags and labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ matrix.image }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=branch
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build (and push, except on pull requests)
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Only the server's Dockerfile declares these; the sidecar's
          # ignores them.
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            COMMIT=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
