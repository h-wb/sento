# Nightly drift detection. These checks depend on things Sento does not
# control — the MangaBaka API, extension repos and the sites extensions
# scrape, newly published security advisories — so they run on a schedule
# rather than on pull requests: a MangaBaka outage should never red a PR
# about the parser.
name: Nightly

on:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:

concurrency:
  group: nightly
  cancel-in-progress: false

permissions:
  contents: read

# gopls is an editor language server: no task here uses it, and resolving
# its "latest" on every run is a network round-trip that has already timed
# out and failed a build. Developers keep it via mise.toml.
env:
  MISE_DISABLE_TOOLS: go:golang.org/x/tools/gopls

jobs:
  mangabaka:
    name: MangaBaka API
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
        with:
          cache: true
      - name: Contract tests against the live API
        run: mise run test:contract

  sidecar:
    name: sento-host sidecar
    uses: ./.github/workflows/sidecar.yml

  vulnerabilities:
    name: Known vulnerabilities
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
        with:
          cache: true
      # govulncheck reports only advisories whose vulnerable code is
      # actually reachable; npm audit reads the lockfile, no install needed.
      - name: Go (reachable) and npm (high and above)
        run: mise run vuln

  # One tracking issue, labelled upstream-drift: opened on the first red
  # night, commented on while it stays red, closed by the first green one —
  # so an open issue always means "still failing", never "failed once".
  report:
    name: Track the result
    runs-on: ubuntu-latest
    needs: [mangabaka, sidecar, vulnerabilities]
    if: always() && github.event_name == 'schedule'
    permissions:
      issues: write
    steps:
      - name: Open, update or close the tracking issue
        uses: actions/github-script@v9
        env:
          NEEDS: ${{ toJSON(needs) }}
        with:
          script: |
            const label = 'upstream-drift'
            const url = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            const hints = {
              mangabaka: '**MangaBaka** — a response shape moved, or the API is down; see `internal/metadata/mangabaka` (`mise run test:contract`).',
              sidecar: '**sento-host** — the vendored Suwayomi tree, an extension repo or a source site broke; see `host/` (`mise run host:contract`).',
              vulnerabilities: '**Vulnerabilities** — a new advisory affects a dependency; bump it (`mise run vuln`).',
            }
            const needs = JSON.parse(process.env.NEEDS)
            const failed = Object.keys(needs).filter((job) => needs[job].result !== 'success')

            const open = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: label,
            })
            const issues = open.filter((i) => !i.pull_request)

            if (failed.length === 0) {
              for (const issue of issues) {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issue.number,
                  body: `Passing again — ${url}`,
                })
                await github.rest.issues.update({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issue.number,
                  state: 'closed',
                  state_reason: 'completed',
                })
              }
              return
            }

            const lines = failed.map((job) => `- ${hints[job] ?? job}`)
            if (issues.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issues[0].number,
                body: [`Still failing — ${url}`, '', ...lines].join('\n'),
              })
              return
            }
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: 'Nightly checks are failing',
              labels: [label],
              body: [
                'The nightly run failed.',
                '',
                `Run: ${url}`,
                '',
                'A failure here usually means something outside this repo changed, not that the repo regressed:',
                ...lines,
                '',
                'This issue closes itself on the next green night.',
              ].join('\n'),
            })
