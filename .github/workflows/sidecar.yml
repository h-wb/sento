# The sento-extensions sidecar is built from a vendored Suwayomi tree pinned in
# extensions/vendir.yml, which Renovate bumps. Building it is a long JVM job, so
# it runs only when something that could break it changes — which includes
# Renovate's own vendir pull requests.
name: Sidecar

on:
  push:
    branches: [main]
    # Repeated verbatim below: GitHub Actions does not support YAML anchors.
    paths:
      - 'extensions/**'
      - 'internal/extensions/**'
      - '.github/workflows/sidecar.yml'
      - 'mise.toml'
  pull_request:
    paths:
      - 'extensions/**'
      - 'internal/extensions/**'
      - '.github/workflows/sidecar.yml'
      - 'mise.toml'
  workflow_dispatch:
  # The nightly run reuses this job to catch drift on the extension side
  # (repos and sites move without anything changing here).
  workflow_call:

concurrency:
  # github.workflow is the *caller's* name under workflow_call, so the
  # nightly run and a push to main never cancel each other.
  group: sidecar-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# gopls is an editor language server: no task here uses it, and resolving
# its "latest" on every run is a network round-trip that has already timed
# out and failed a build. Developers keep it via mise.toml.
env:
  MISE_DISABLE_TOOLS: go:golang.org/x/tools/gopls

jobs:
  contract:
    name: Build and contract-test the sidecar
    runs-on: ubuntu-latest
    # Gradle compiles the whole vendored Suwayomi tree from scratch.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          cache: true

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Build the sidecar and run the contract tests
        run: mise run extensions:contract
        env:
          # Set these as repository variables to unlock the tier that
          # installs a real extension and drives a live source; without
          # them only the boot/repo contract is checked.
          SENTO_TEST_EXTENSION_REPO: ${{ vars.SENTO_TEST_EXTENSION_REPO }}
          SENTO_TEST_EXTENSION_PKG: ${{ vars.SENTO_TEST_EXTENSION_PKG }}
          SENTO_TEST_SEARCH_QUERY: ${{ vars.SENTO_TEST_SEARCH_QUERY }}
