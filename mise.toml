min_version = "2026.10.4" # older mise rejects `secrets` on a task

[settings]
# [daemons] and the tasks that require them are experimental in mise;
# so are [secrets.fnox] task grants (fnox.toml).
experimental = true

# Everything a check depends on is pinned, so a run is reproducible and a
# tool upgrade arrives as a reviewable Renovate PR instead of as a surprise
# red build. Only gopls floats: it is an editor language server no task
# uses (CI skips it via MISE_DISABLE_TOOLS).
# Exact versions, not ranges: CI caches installs keyed on this file, so a
# range like "1.27" kept a cached go1.27.1 through its security release.
[tools]
go = "1.27.3"
node = "24.20.0"
# Java keeps its upstream build metadata ("+9.0.LTS"): macOS resolves only
# the full form, so the pin uses it.
java = "temurin-21.0.13+9.0.LTS"
vendir = "0.46.2"
gradle = "9.8.0"
golangci-lint = "2.14.0"
actionlint = "1.7.12"
shellcheck = "0.11.0" # actionlint runs it over every `run:` script
pitchfork = "2.30.1" # supervises the [daemons] dev stack
"github:jdx/fnox" = "1.44.0" # fetches fnox.toml secrets for granted tasks
"github:protonpass/pass-cli" = "2.5.1" # Proton Pass CLI (fnox backend)
"go:golang.org/x/tools/gopls" = "latest"

[env]
CGO_ENABLED = "0"
# Dev defaults (override machine-specific values in mise.local.toml,
# which is gitignored — e.g. SENTO_QBITTORRENT_URL, SENTO_PROWLARR_API_KEY).
SENTO_DB_PATH = "data/sento.db"
SENTO_LIBRARY_PATH = "data/library"
# Dev default: sento-extensions sidecar on its default port (mise run extensions:run).
# Read from the caller first: mise [env] otherwise overrides it, and the Paseo
# `api` service (paseo.json) points the backend at its worktree's sidecar.
SENTO_EXTENSIONS_URL = "{{ get_env(name='SENTO_EXTENSIONS_URL', default='http://localhost:8901') }}"
# fnox/pass-cli use an agent session scoped to this repo; its token is the
# macOS Keychain item pass-cli-sento on a workstation, PROTON_PASS_TOKEN in
# the paseo pod. Log it in with `mise run pass:login` — see fnox.toml.
PROTON_PASS_SESSION_DIR = "{{env.HOME}}/.local/state/pass-cli/sento"
PROTON_PASS_AGENT_REASON = "sento fnox"

# fnox fetches the fnox.toml secrets; a task lists the keys it needs in
# `secrets = [...]` and nothing reaches the activated shell or `mise env`.
[secrets.fnox]

# --- dev stack (long-running processes; pitchfork supervises them) ---
#
#   mise run dev            sidecar + backend + web UI, built first, waited
#                           on, then their logs (= mise daemons start + logs -t)
#   mise run dev:stop       stop everything this checkout started
#
# Every port is automatic: the primary checkout gets the base below and a
# linked git worktree gets its own offset, so two checkouts run side by
# side. Each daemon starts its process with the same mise task a terminal
# uses (extensions:run, web:dev); paseo.json's services call those tasks
# too, so each process has exactly one definition of how it starts.

[daemons_settings]
namespace = "sento"

[daemon_groups]
# What a bare `mise daemons start` brings up; the rest start on demand.
default = ["extensions", "api", "web"]

[daemons.extensions]
dir = "extensions"
init = "mise run extensions:build"
run = "SENTO_EXTENSIONS_PORT=$EXTENSIONS_PORT mise run extensions:run"
port = { auto = true, base = 8901 }
# Generous: the first start compiles the vendored Suwayomi tree, then boots a JVM.
ready_cmd = { run = "curl -fsS http://127.0.0.1:$EXTENSIONS_PORT/health", timeout = "15m" }

[daemons.api]
# Not `mise run run` on purpose: that task builds and runs in one step, so
# a broken build would take the daemon down with it. init keeps the last
# good binary and the daemon keeps serving it, with BUILD FAILED in the log.
init = "mise run build || echo 'BUILD FAILED: still serving the previous bin/sento' >&2"
run = "SENTO_PORT=$API_PORT SENTO_EXTENSIONS_URL=http://127.0.0.1:$EXTENSIONS_PORT exec bin/sento"
port = { auto = true, base = 8484 }
ready_cmd = { run = "curl -fsS http://127.0.0.1:$API_PORT/api/v1/system/health", timeout = "5m" }
depends = ["extensions"]
# Rebuild and restart on a Go change (the web UI hot-reloads by itself).
watch = ["cmd/**/*.go", "internal/**/*.go", "go.mod"]

[daemons.web]
dir = "web"
init = "mise run web:install"
# vite.config.ts proxies /api to $SENTO_API_URL.
run = "SENTO_API_URL=http://127.0.0.1:$API_PORT mise run web:dev -- --host 127.0.0.1 --port $WEB_PORT --strictPort"
port = { auto = true, base = 5173 }
ready_cmd = { run = "curl -fsS http://127.0.0.1:$WEB_PORT/", timeout = "5m" }
depends = ["api"]

# A throwaway sidecar for `mise run extensions:contract`: its own port, and a
# data directory wiped on every start so no installed extension carries over.
[daemons.extensions-contract]
dir = "extensions"
init = ["mise run extensions:build", "rm -rf build/contract-data"]
run = "SENTO_EXTENSIONS_PORT=$EXTENSIONS_CONTRACT_PORT SENTO_EXTENSIONS_DATA=build/contract-data mise run extensions:run"
port = { auto = true, base = 8951 }
proxy = false
ready_cmd = { run = "curl -fsS http://127.0.0.1:$EXTENSIONS_CONTRACT_PORT/health", timeout = "15m" }

# PostgreSQL for `mise run test:pg`. The preset installs the server, keeps
# its data outside the checkout and exports DATABASE_URL.
[daemons.postgres]
preset = "postgres"
version = "17"
port = "auto"
options.database = "sento"

[tasks.dev]
description = "Bring up the whole dev stack (sidecar, backend, web UI) and follow its logs"
# Ctrl-C ends the log view only; the stack keeps running until `mise run dev:stop`.
daemons = ["extensions", "api", "web"]
run = [
  "mise daemons urls",
  "mise daemons logs -t extensions api web",
]

[tasks."dev:stop"]
description = "Stop everything the dev stack started"
run = "mise daemons stop"

[tasks.build]
description = "Build the sento binary"
run = "go build -o bin/sento ./cmd/sento"

[tasks.run]
description = "Run sento (dev)"
run = "go run ./cmd/sento"

[tasks."run:agent"]
description = "Run sento with the agent-stack upstream seeds (fnox secrets; the paseo api service)"
# The secrets are handed to this task only (see fnox.toml); the plain `run`
# task stays secret-free so terminal and daemon starts never need a Proton
# Pass session. paseo.json's api service runs this with the non-secret
# upstream env (URLs, sento-test category) on its command line. The command
# is `go run` directly, not `mise run run`: granted secrets reach this
# task's own process only — a nested mise task drops them (probed on the
# paseo pod: direct grant SET, nested run empty).
# For the same reason it watches for itself, like the api daemon's `watch`:
# a Go change rebuilds and restarts the server on the same port (so the web
# service's proxy keeps working); a failed build logs BUILD FAILED and keeps
# serving the previous binary.
secrets = ["SENTO_QBITTORRENT_USERNAME", "SENTO_QBITTORRENT_PASSWORD", "SENTO_PROWLARR_API_KEY"]
run = '''
#!/usr/bin/env bash
set -u
bin=bin/sento-agent mark=bin/.sento-agent-built pid=
stop() { if [ -n "$pid" ]; then kill "$pid" 2>/dev/null; wait "$pid"; fi; }
trap 'stop; exit 0' INT TERM
mkdir -p bin && touch "$mark"
go build -o "$bin" ./cmd/sento || exit 1
"$bin" & pid=$!
while sleep 2; do
  if ! kill -0 "$pid" 2>/dev/null; then wait "$pid"; exit; fi
  changed=$(find cmd internal go.mod go.sum -newer "$mark" \( -name '*.go' -o -name 'go.mod' -o -name 'go.sum' \) -print -quit)
  [ -n "$changed" ] || continue
  touch "$mark"
  echo "run:agent: $changed changed, rebuilding" >&2
  if go build -o "$bin.new" ./cmd/sento; then
    stop; mv "$bin.new" "$bin"; "$bin" & pid=$!
  else
    echo "BUILD FAILED: still serving the previous bin/sento-agent" >&2
  fi
done
'''

[tasks."pass:login"]
description = "Log the repo's scoped Proton Pass agent session in (macOS Keychain, or PROTON_PASS_TOKEN on the paseo pod)"
quiet = true
run = '''
mkdir -p "$PROTON_PASS_SESSION_DIR" && chmod 700 "$PROTON_PASS_SESSION_DIR"
pass-cli info >/dev/null 2>&1 && { echo "already logged in"; exit 0; }
if command -v security >/dev/null 2>&1; then
    token="$(security find-generic-password -s pass-cli-sento -a "$USER" -w)"
elif [ -n "${PROTON_PASS_TOKEN:-}" ]; then
    token="$PROTON_PASS_TOKEN"
else
    echo "pass:login: no macOS Keychain (security) and no PROTON_PASS_TOKEN; skipping" >&2
    exit 0
fi
PROTON_PASS_PERSONAL_ACCESS_TOKEN="$token" pass-cli login
'''

[tasks.test]
description = "Run Go tests"
run = "go test ./..."

[tasks."test:race"]
description = "Run Go tests under the race detector"
# The detector needs cgo, which the build itself keeps off (static binary).
run = "go test -race ./..."
env = { CGO_ENABLED = "1" }

[tasks.vuln]
description = "Report known vulnerabilities reachable from the code (Go) and in web dependencies"
run = [
  "go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...",
  "npm --prefix web audit --audit-level=high",
]

[tasks.lint]
description = "Lint Go code"
run = "golangci-lint run"

[tasks."web:dev"]
description = "Run the web UI dev server"
dir = "web"
# The trailing `--` hands task arguments (e.g. --port) to vite, not npm.
run = "npm run dev --"

[tasks."web:build"]
description = "Build the web UI"
dir = "web"
run = "npm run build"

[tasks."extensions:vendor"]
description = "Sync vendored Suwayomi pieces (pinned in extensions/vendir.lock.yml)"
dir = "extensions"
# Skipped while vendor/ is newer than the pin (and this file), so starting
# the Paseo `extensions` service doesn't re-fetch Suwayomi every time.
sources = ["vendir.yml", "vendir.lock.yml"]
outputs = ["vendor/**/*"]
run = "vendir sync"

[tasks."extensions:build"]
description = "Build the sento-extensions sidecar (JVM)"
dir = "extensions"
depends = ["extensions:vendor"]
run = "gradle :app:installDist"

[tasks."extensions:run"]
description = "Run the sento-extensions sidecar"
dir = "extensions"
run = "./app/build/install/app/bin/app"

[tasks.gen]
description = "Generate TypeScript API types from Go structs"
run = "go tool tygo generate"

# --- checks (CI runs these tasks; GitHub Actions is only the runner) ---

[tasks.ci]
description = "Everything CI runs on a pull request"
# Sequential on purpose: `depends` would run these in parallel, and the
# npm install has to land before anything touches web/.
run = [
  "mise run web:install",
  "mise run lint",
  "mise run lint:ci",
  "mise run lint:web",
  "mise run gen:check",
  "mise run test:race",
  "mise run e2e",
]

[tasks."web:install"]
description = "Install web dependencies from the lockfile"
dir = "web"
run = "npm ci"

[tasks."lint:ci"]
description = "Lint the GitHub Actions workflows"
run = "actionlint"

[tasks."lint:web"]
description = "Lint the web UI"
dir = "web"
run = "npm run lint"

[tasks."gen:check"]
description = "Fail if the generated TypeScript types are stale (run: mise run gen)"
run = """
go tool tygo generate
git diff --exit-code HEAD -- web/src/types || {
  echo 'web/src/types is out of date — run `mise run gen` and commit the result.' >&2
  exit 1
}
"""

[tasks."test:pg"]
description = "Run the Go suite against PostgreSQL (dialect conformance)"
daemons = "postgres"
run = 'SENTO_TEST_DB_URL="$DATABASE_URL" go test ./...'

[tasks."test:contract"]
description = "Contract tests against the live MangaBaka API (network)"
run = "go test -tags contract -count=1 -v ./internal/metadata/mangabaka"

# --- end-to-end (browser, real Go stack, stubbed upstreams) ---

[tasks."e2e:build"]
description = "Build the binaries the Playwright suite drives"
depends = ["web:build"]
run = [
  "go build -o bin/sento ./cmd/sento",
  "go build -tags e2e -o bin/e2estub ./cmd/e2estub",
]

[tasks."e2e:install"]
description = "Install the Playwright browser (once per machine/CI image)"
dir = "web"
run = "npm run e2e:install"

[tasks.e2e]
description = "Run the Playwright end-to-end suite"
depends = ["e2e:build"]
dir = "web"
run = "npm run e2e"

[tasks."e2e:ui"]
description = "Run the end-to-end suite in Playwright's interactive UI"
depends = ["e2e:build"]
dir = "web"
run = "npm run e2e:ui"

# --- sidecar (JVM; vendored Suwayomi pieces) ---

[tasks."extensions:contract"]
description = "Build the sidecar, start it, and run internal/extensions contract tests"
daemons = "extensions-contract"
run = """
trap 'mise daemons stop extensions-contract' EXIT
SENTO_EXTENSIONS_URL="http://127.0.0.1:$EXTENSIONS_CONTRACT_PORT" go test -tags contract -count=1 -v ./internal/extensions
"""

# --- container image ---

[tasks."image:build"]
description = "Build the container image locally (single-arch, for the host)"
# CI builds the same Dockerfile multi-arch via buildx; the registry cache
# and provenance wiring there are Actions-specific and stay in the workflow.
run = """
docker build \
  --build-arg VERSION="$(git describe --tags --always --dirty 2>/dev/null || echo dev)" \
  --build-arg COMMIT="$(git rev-parse HEAD)" \
  -t sento:dev .
"""

[tasks."image:build:extensions"]
description = "Build the sento-extensions sidecar image locally"
run = "docker build -t sento-extensions:dev extensions"

[tasks."image:run"]
description = "Run the locally built image against ./data"
depends = ["image:build"]
run = """
mkdir -p data/config data/library data/downloads
docker run --rm -p 8484:8484 \
  -v "$PWD/data/config:/config" \
  -v "$PWD/data/library:/library" \
  -v "$PWD/data/downloads:/downloads" \
  sento:dev
"""
