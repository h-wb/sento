# TypeScript types generated from the Go structs (the API schema lives in
# the backend): mise run gen
packages:
  - path: "github.com/h-wb/sento/internal/parse"
    output_path: "web/src/types/parse.ts"
    exclude_files: ["num.go"]
    frontmatter: |
      /* eslint-disable */
      // The parser has custom JSON marshaling: numbers are plain units, ranges are pairs.
      export type Num = number
      export type Range = [Num, Num]

  - path: "github.com/h-wb/sento/internal/scheduler"
    output_path: "web/src/types/scheduler.ts"
    frontmatter: |
      /* eslint-disable */

  - path: "github.com/h-wb/sento/internal/metadata"
    output_path: "web/src/types/metadata.ts"
    frontmatter: |
      /* eslint-disable */
    type_mappings:
      json.RawMessage: "any"

  - path: "github.com/h-wb/sento/internal/store"
    output_path: "web/src/types/store.ts"
    frontmatter: |
      /* eslint-disable */
    type_mappings:
      json.RawMessage: "any"
      metadata.Series: "any /* metadata.Series */"
      metadata.Collection: "any /* metadata.Collection */"
      metadata.Work: "any /* metadata.Work */"

  - path: "github.com/h-wb/sento/internal/extensions"
    output_path: "web/src/types/extensions.ts"
    frontmatter: |
      /* eslint-disable */

  - path: "github.com/h-wb/sento/internal/profile"
    output_path: "web/src/types/profile.ts"
    frontmatter: |
      /* eslint-disable */

  - path: "github.com/h-wb/sento/internal/service"
    output_path: "web/src/types/service.ts"
    frontmatter: |
      /* eslint-disable */
      import type { SeriesRef } from "./metadata"
      import type { Result, Step } from "./parse"
      import type { Condition, LedgerRules } from "./profile"
      import type { ExtensionInfo } from "./extensions"
      import type { Work, ExpectedSlot, DownloadTarget, Binding, Indexer, SiteOverride } from "./store"
    type_mappings:
      profile.Condition: "Condition"
      profile.LedgerRules: "LedgerRules"
      parse.Result: "Result"
      parse.Step: "Step"
      store.Work: "Work"
      store.ExpectedSlot: "ExpectedSlot"
      store.DownloadTarget: "DownloadTarget"
      store.Binding: "Binding"
      store.Indexer: "Indexer"
      store.SiteOverride: "SiteOverride"
      metadata.SeriesRef: "SeriesRef"
      extensions.ExtensionInfo: "ExtensionInfo"

  - path: "github.com/h-wb/sento/internal/server"
    output_path: "web/src/types/server.ts"
    frontmatter: |
      /* eslint-disable */
      import type { ScanResult, SearchResult, TargetSlot } from "./service"
      import type { Collection, Series } from "./store"
      import type { RepoStatus } from "./extensions"
    type_mappings:
      extensions.RepoStatus: "RepoStatus"
      service.TargetSlot: "TargetSlot"
      service.SearchResult: "SearchResult"
      service.ScanResult: "ScanResult"
      store.Series: "Series"
      store.Collection: "Collection"
