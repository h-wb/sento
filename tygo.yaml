# TypeScript types generated from the Go structs (the API schema lives in
# the backend): mise run gen
packages:
  - path: "github.com/h-wb/sento/internal/parse"
    output_path: "web/src/types/parse.ts"
    frontmatter: |
      /* eslint-disable */

  - path: "github.com/h-wb/sento/internal/metadata"
    output_path: "web/src/types/metadata.ts"
    frontmatter: |
      /* eslint-disable */
    type_mappings:
      json.RawMessage: "any"

  - path: "github.com/h-wb/sento/internal/store"
    output_path: "web/src/types/store.ts"
    frontmatter: |
      /* eslint-disable */
    type_mappings:
      json.RawMessage: "any"
      metadata.Series: "any /* metadata.Series */"
      metadata.Collection: "any /* metadata.Collection */"
      metadata.Work: "any /* metadata.Work */"

  - path: "github.com/h-wb/sento/internal/ledger"
    output_path: "web/src/types/ledger.ts"
    frontmatter: |
      /* eslint-disable */

  - path: "github.com/h-wb/sento/internal/suwayomi"
    output_path: "web/src/types/suwayomi.ts"
    frontmatter: |
      /* eslint-disable */

  - path: "github.com/h-wb/sento/internal/service"
    output_path: "web/src/types/service.ts"
    frontmatter: |
      /* eslint-disable */
      import type { SeriesRef } from "./metadata"
      import type { Result } from "./parse"
      import type { Binding, SiteOverride } from "./store"
    type_mappings:
      parse.Result: "Result"
      store.Binding: "Binding"
      store.SiteOverride: "SiteOverride"
      metadata.SeriesRef: "SeriesRef"

  - path: "github.com/h-wb/sento/internal/server"
    output_path: "web/src/types/server.ts"
    frontmatter: |
      /* eslint-disable */
      import type { ChapterSlot, VolumeSlot } from "./ledger"
      import type { ScanResult, SearchResult, TargetSlot } from "./service"
      import type { ChapterLedger, Collection, Series } from "./store"
    type_mappings:
      ledger.VolumeSlot: "VolumeSlot"
      ledger.ChapterSlot: "ChapterSlot"
      service.TargetSlot: "TargetSlot"
      service.SearchResult: "SearchResult"
      service.ScanResult: "ScanResult"
      store.Series: "Series"
      store.Collection: "Collection"
      store.ChapterLedger: "ChapterLedger"
