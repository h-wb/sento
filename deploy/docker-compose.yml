# Sento plus its extension sidecar. Torrent indexers (Prowlarr/Jackett
# Torznab endpoints) and qBittorrent are services you already run; point
# Sento at them under Settings, or with the commented variables below.
#
#   docker compose up -d        # then open http://localhost:8484
#
# Sento has no authentication of its own yet: do not expose port 8484
# beyond a network you trust without an authenticating reverse proxy.
name: sento

services:
  sento:
    image: ghcr.io/h-wb/sento:latest
    # To run your working tree instead of the published image:
    # build:
    #   context: ..
    ports:
      - "8484:8484"
    environment:
      TZ: Etc/UTC
      # Seeds the connection settings on first start; once saved in the UI,
      # the stored settings win and these are ignored.
      SENTO_EXTENSIONS_URL: http://sento-extensions:8901
      # SENTO_QBITTORRENT_URL: http://qbittorrent:8080
      # SENTO_QBITTORRENT_USERNAME: admin
      # SENTO_QBITTORRENT_PASSWORD: ...
      # qBittorrent reports paths as *it* sees them. If its download folder
      # is mounted here under another path, map it ("remote=local", comma-
      # separated). Imports hardlink, so keep downloads and the library on
      # one filesystem to avoid a second copy of every volume.
      # SENTO_PATH_MAPPINGS: /downloads=/torrents
    volumes:
      - sento-config:/config
      - ./library:/library
      - ./downloads:/downloads
      # - /path/to/qbittorrent/downloads:/torrents
    depends_on:
      - sento-extensions
    restart: unless-stopped

  # Runs Tachiyomi/Mihon extensions for chapter sources. Ships with no
  # extensions and no repos: add a repo URL in Sento (Connections page),
  # then add sources on the Indexers page — Sento installs what they need.
  sento-extensions:
    image: ghcr.io/h-wb/sento-extensions:latest
    # build:
    #   context: ../extensions
    environment:
      TZ: Etc/UTC
      # For sources behind Cloudflare:
      # SENTO_EXTENSIONS_FLARESOLVERR_URL: http://flaresolverr:8191
    volumes:
      # Optional: the sidecar is stateless (Sento reconciles extensions and
      # source logins onto it), this only spares the re-install on restart.
      - sento-extensions-data:/data
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8901"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3
    restart: unless-stopped
    # Not published on the host: only Sento talks to it, over the compose
    # network.

volumes:
  sento-config:
  sento-extensions-data:
