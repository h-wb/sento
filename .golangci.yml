version: "2"

run:
  timeout: 5m
  # Lint the build-tagged files too — the e2e stub and the contract tests
  # are excluded from `go test ./...`, so nothing else would ever see them.
  build-tags:
    - e2e
    - contract

linters:
  exclusions:
    paths:
      - web

# Unformatted Go fails lint, as it would fail review.
formatters:
  enable:
    - gofmt
